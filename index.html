<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسجيل الدخول - نظام إدارة إسكان أعضاء هيئة التدريس</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/modern-template.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a9b8e 0%, #0d7a70 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 450px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, #1a9b8e 0%, #0d7a70 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .login-logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .login-header h1 {
            font-size: 1.75rem;
            margin: 0 0 10px;
            font-weight: 700;
        }

        .login-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .login-body {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #212529;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            outline: none;
            border-color: #1a9b8e;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(26, 155, 142, 0.1);
        }

        .form-control::placeholder {
            color: #adb5bd;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .form-check-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #1a9b8e;
        }

        .form-check-label {
            margin: 0;
            cursor: pointer;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a9b8e 0%, #0d7a70 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 155, 142, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            padding: 20px 40px;
            background-color: #f8f9fa;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }

        .login-footer p {
            margin: 0;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .login-footer a {
            color: #1a9b8e;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #0d7a70;
            text-decoration: underline;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 4px solid #e74c3c;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #27ae60;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #3498db;
        }

        .demo-credentials {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .demo-credentials h4 {
            margin: 0 0 10px;
            font-size: 0.9rem;
            color: #212529;
        }

        .demo-credentials p {
            margin: 5px 0;
            color: #6c757d;
        }

        .demo-credentials code {
            background-color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #1a9b8e;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .login-body {
                padding: 30px 20px;
            }

            .login-header {
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .login-footer {
                padding: 15px 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/css/enhanced-mobile.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">
                    <img src="static/images/university_logo.png" alt="شعار الجامعة">
                </div>
                <h1>نظام الإسكان</h1>
                <p>نظام إدارة إسكان أعضاء هيئة التدريس</p>
            </div>

            <!-- Body -->
            <div class="login-body">
                <!-- Alert Messages -->
                <div id="alertContainer"></div>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="username">
                            <i class="fas fa-user"></i> اسم المستخدم
                        </label>
                        <input 
                            type="text" 
                            id="username" 
                            class="form-control" 
                            placeholder="أدخل اسم المستخدم"
                            required
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">
                            <i class="fas fa-lock"></i> كلمة المرور
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="أدخل كلمة المرور"
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <div class="form-check">
                        <input 
                            type="checkbox" 
                            id="rememberMe" 
                            class="form-check-input"
                        >
                        <label class="form-check-label" for="rememberMe">
                            تذكرني
                        </label>
                    </div>

                    <button type="submit" class="login-btn">
                        <span class="loading-spinner" id="spinner"></span>
                        <span id="btnText">تسجيل الدخول</span>
                    </button>
                </form>

                <!-- Demo Credentials -->
                <div class="demo-credentials">
                    <h4><i class="fas fa-info-circle"></i> بيانات تجريبية</h4>
                    <p><strong>المسؤول:</strong> <code>admin</code> / <code>Admin@2025</code></p>
                    <p><strong>المشاهد:</strong> <code>viewer</code> / <code>Viewer@2025</code></p>
                </div>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p>
                    هل تواجه مشكلة؟ 
                    <a href="#support">اتصل بالدعم الفني</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const alertContainer = document.getElementById('alertContainer');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Show loading state
            spinner.style.display = 'inline-block';
            btnText.textContent = 'جاري التحقق...';
            loginForm.querySelector('button').disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        remember_me: rememberMe
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Success
                    showAlert('تم تسجيل الدخول بنجاح!', 'success');
                    setTimeout(() => {
                        window.location.href = '/welcome_portal.html';
                    }, 1500);
                } else {
                    // Error
                    showAlert(data.error_ar || 'فشل تسجيل الدخول', 'danger');
                }
            } catch (error) {
                showAlert('حدث خطأ في الاتصال. حاول مرة أخرى.', 'danger');
            } finally {
                // Hide loading state
                spinner.style.display = 'none';
                btnText.textContent = 'تسجيل الدخول';
                loginForm.querySelector('button').disabled = false;
            }
        });

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'danger' ? 'exclamation-circle' : 'info-circle'}"></i>
                <span>${message}</span>
            `;
            
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);

            // Auto-remove alert after 5 seconds
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // Check if user is already logged in
        fetch('/api/auth/validate')
            .then(response => {
                if (response.ok) {
                    window.location.href = '/welcome_portal.html';
                }
            })
            .catch(() => {
                // User is not logged in, show login form
            });
    </script>
    <script src="/static/js/enhanced-features.js"></script>
</body>
</html>
