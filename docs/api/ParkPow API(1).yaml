  /api/v1/task-check/:
    get:
      operationId: Check Task Result
      description: |-
        The Check Task Result API provides a mechanism to check the status and retrieve results of asynchronous tasks.
        When querying this endpoint with a valid task ID, it returns the task result indicating whether the operation was successful or failed.
        Results are cached for 6 hours after retrieval to improve performance and reduce redundant processing.
        If the requested task is still in progress or cannot be found in the system, the API will return an empty JSON response.
      parameters:
      - in: query
        name: task_id
        schema:
          type: string
        description: Unique identifier of the asynchronous task.
      tags:
      - Tasks
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleImportTaskResponse'
              examples:
                SuccessVehicleImportExample:
                  value:
                    info: Updated 3 records successfully.
                  summary: Success Vehicle Import Example
                ErrorVehicleImportExample:
                  value:
                    error: Failed to import.
                  summary: Error Vehicle Import Example
          description: Task result of the vehicle import process.
