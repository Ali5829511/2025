openapi: 3.0.3
info:
  title: ParkPow API
  version: 1.0.0
  description: "[ParkPow](https://parkpow.com/) is a software to manage and enforce\
    \ parking lots. It lets you track vehicles, get custom alerts, enforce your parking\
    \ rules.    <br><br><br>\n    ParkPow.com API is only available to registered\
    \ users.\n    You first have to register and <a href=\"https://app.parkpow.com/accounts/token/\"\
    >get an API key</a>.\n    It has to be included in all API calls. The HTTP <b>headers</b>\
    \ must contain:\n    <br><br>\n    <code>Authorization: Token API_TOKEN</code>\n\
    \    <br><br>\n    <aside>You must replace <code>API_TOKEN</code> with your personal\
    \ API key.</aside>\n    "
  x-logo:
    url: /static/images/docs-logo.png
    backgroundColor: rgb(38, 50, 56)
    href: /
    altText: Logo
paths:
  /api/v1/create-camera/:
    post:
      operationId: Create or Update Camera Details
      description: |-
        This API endpoint is used to create or update a camera object used
        while integrating your data into ParkPow. Your are adviced to create
        a few cameras (Entrance or Exit) before using the integration
        api.
      tags:
      - Cameras
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Camera'
            examples:
              Example1:
                value:
                  code: Entrance1
                  name: Entrance 1
                  type: Entrance
                  latitude: 0.33
                  longitude: 0.333
                  notes: Front gate
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Camera'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Camera'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
              examples:
                Example1:
                  value:
                    code: Entrance1
                    name: Entrance 1
                    type: Entrance
                    latitude: 0.33
                    longitude: 0.333
                    notes: Front gate
                  summary: Example 1
          description: The result includes an extra type field.
        '400':
          description: Bad request
  /api/v1/create-vehicle/:
    post:
      operationId: Create or Update Vehicle
      description: |-
        Purpose is: Incorporate 3rd party data (e.g. tenant database,
        HR database, payment database) into ParkPow so that you can more
        fully understand the vehicles captured in the dashboard.
      tags:
      - Vehicles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vehicle'
            examples:
              ExampleRequest:
                value:
                  license_plate: ABC1234
                  region: us-ny
                  payment_status: 0
                  make: Nissan
                  model: X3
                  color: yellow
                  type: pickup_truck
                  field1: First Name
                  field2: Last Name
                  field3: Department
                  field4: Company
                  field5: 'Floor #'
                  field6: Notes
                summary: Example Request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vehicle'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vehicle'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
              examples:
                ExampleResponse:
                  value:
                    license_plate: ABC1234
                    region: us-ny
                    payment_status: 0
                    make: Nissan
                    model: X3
                    color: yellow
                    type: pickup_truck
                    field1: First Name
                    field2: Last Name
                    field3: Department
                    field4: Company
                    field5: 'Floor #'
                    field6: Notes
                    id: 100
                    vehicle_tags:
                    - Authorized
                  summary: Example Response
          description: ''
