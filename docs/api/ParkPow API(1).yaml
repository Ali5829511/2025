  /api/v1/vehicles/:
    get:
      operationId: List Vehicles
      description: List user vehicles optionally with filters.
      parameters:
      - in: query
        name: color
        schema:
          type: string
          nullable: true
          enum:
          - black
          - blue
          - brown
          - green
          - red
          - silver
          - white
          - yellow
        description: |-
          * `black` - Black
          * `blue` - Blue
          * `brown` - Brown
          * `green` - Green
          * `red` - Red
          * `silver` - Silver
          * `white` - White
          * `yellow` - Yellow
      - in: query
        name: license_plate__icontains
        schema:
          type: string
      - in: query
        name: license_plate__iexact
        schema:
          type: string
      - in: query
        name: make__icontains
        schema:
          type: string
      - in: query
        name: make__iexact
        schema:
          type: string
      - in: query
        name: model__icontains
        schema:
          type: string
      - in: query
        name: model__iexact
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: payment_status
        schema:
          type: integer
          enum:
          - 0
          - 1
        description: |-
          Payment status, 0 - unpaid, 1 - paid

          * `0` - UNPAID_STATUS
          * `1` - PAID_STATUS
      - in: query
        name: tags
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: tags__isnull
        schema:
          type: boolean
      - in: query
        name: type
        schema:
          type: string
          enum:
          - big_truck
          - bus
          - motorcycle
          - pickup_truck
          - sedan
          - suv
          - unknown
          - van
        description: |-
          * `bus` - Bus
          * `sedan` - Sedan
          * `motorcycle` - Motorcycle
          * `pickup_truck` - Pickup Truck
          * `suv` - SUV
          * `big_truck` - Big Truck
          * `unknown` - Unknown
          * `van` - Van
      tags:
      - Vehicles
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVehicleList'
              examples:
                ExampleResponse:
                  value:
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - license_plate: ABC1234
                      region: us-ny
                      payment_status: 0
                      make: Nissan
                      model: X3
                      color: yellow
                      type: pickup_truck
                      field1: First Name
                      field2: Last Name
                      field3: Department
                      field4: Company
                      field5: 'Floor #'
                      field6: Notes
                      id: 100
                      vehicle_tags:
                      - Authorized
                    estimated_count: 123
                  summary: Example Response
          description: ''
