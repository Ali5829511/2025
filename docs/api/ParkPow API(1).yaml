      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Visits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LPR'
            examples:
              Example:
                value:
                  camera: entrance_1
                  image: iVBORw0KGgoAAAANSUhEUgAAAEQAAAAYCAIAAADMPcxpAAAPyElEQ...
                  results:
                  - plate:
                      box:
                        xmin: 231
                        ymin: 238
                        ymax: 266
                        xmax: 305
                      score: 0.592
                      type: Plate
                      props:
                        plate:
                        - value: smm1439
                          score: 0.905
                        - value: smh1439
                          score: 0.743
                        region:
                        - value: bg
                          score: 0.795
                    direction: 180
                    position_sec: 34.94
                    vehicle:
                      box:
                        xmin: 231
                        ymin: 131
                        ymax: 523
                        xmax: 1070
                      score: 0.834
                      type: Sedan
                      props:
                        color:
                        - score: 0.877
                          value: silver
                        - score: 0.019
                          value: black
                        - score: 0.016
                          value: green
                        orientation:
                        - score: 0.937
                          value: Front
                        - score: 0.032
                          value: Rear
                        - score: 0.031
