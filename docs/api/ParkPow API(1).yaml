  /api/v1/webhooks/receiver-example/:
    post:
      operationId: Web-hook Receiver Example
      description: |-
        To setup a webhook,

        1) Add a webhook from <a href='/settings/webhook/list'>Web-hooks</a>.
        2) Use the webhook on the <a href='/settings/alert/list'>Alert</a> page.
        3) When the alert is triggered, data is sent to the webhook.

        The following describes the json payload received by the webhook.
        This endpoint is expected to not have an authentication mechanism
        and it can be secured by limiting the allowed origins (Parkpow server).
      tags:
      - Alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertWebhook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertWebhook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertWebhook'
        required: true
      responses:
        '200':
          description: Only the status-code is checked. The response body can be empty.
        '500':
          description: If any error response is received from the webhook, then it
            will be retried. If it exceeds the retry limit, then it will be disabled
