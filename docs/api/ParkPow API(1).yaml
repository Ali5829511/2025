                        - make: BMW
                          score: 0.153
                          model: E83
                        - make: BMW
                          score: 0.029
                          model: X5
                  time: 2020-08-21T17:32
              ExampleLegacyFormatStillSupported:
                value:
                  camera: entrance_1
                  image: iVBORw0KGgoAAAANSUhEUgAAAEQAAAAYCAIAAADMPcxpAAAPyElEQ...
                  results:
                  - box:
                      xmin: 374
                      ymin: 468
                      ymax: 548
                      xmax: 710
                    plate: smm1439
                    direction: 180
                    dscore: 0.592
                    orientation:
                    - score: 0.921
                      orientation: Front
                    - score: 0.041
                      orientation: Unknown
                    - score: 0.038
                      orientation: Rear
                    color:
                    - color: silver
                      score: 0.864
                    - color: black
                      score: 0.03
                    - color: yellow
                      score: 0.017
                    region:
                      code: bg
                      score: 0.795
                    model_make:
                    - make: BMW
                      score: 0.254
