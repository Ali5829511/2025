  /api/v1/parking-list/:
    get:
      operationId: Export All Site Data
      description: |-
        Retrieve all site data including the cameras associated
        with each site.

        Examples:
        --------
            curl --location --request GET '/api/v1/parking-list/' --header 'Authorization: Token <api_token>'
      parameters:
      - in: query
        name: name__icontains
        schema:
          type: string
      - in: query
        name: name__iexact
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Sites
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedParkingLotList'
          description: ''
